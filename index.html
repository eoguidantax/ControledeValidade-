<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Controle de Validade — Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15171B;
    --surface: #1D2025;
    --surface-2: #23272E;
    --edge: #33383F;
    --ink: #F2F1EC;
    --ink-dim: #9AA0AA;
    --tape: #F7941D;
    --tape-ink: #1A1005;
    --ok: #3FB779;
    --warn: #FFC72C;
    --urgent: #E4241B;
    --dead: #0B0C0D;
    --dead-ink: #FFFFFF;
    --brand-red: #E4241B;
    --radius: 4px;
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    color:var(--ink);
    font-family: var(--font-mono);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;padding:0 0 80px;}
  button, input, select{font-family:inherit;}

  /* ---------- login ---------- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{background:var(--surface); border:1px solid var(--edge); border-radius:8px; padding:30px 26px; width:100%; max-width:340px; text-align:center;}
  .login-card .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--brand-red);}
  .login-card h1{font-family:var(--font-display); font-size:21px; text-transform:uppercase; margin:8px 0 4px; font-weight:700; font-style:italic;}
  .login-card p{font-size:12px; color:var(--ink-dim); margin:0 0 20px; line-height:1.5;}
  .login-card input{width:100%; background:var(--surface-2); border:1px solid var(--edge); color:var(--ink); padding:13px; border-radius:var(--radius); font-size:16px; letter-spacing:.1em; text-align:center;}
  .login-card button{margin-top:12px; width:100%; padding:12px; background:var(--tape); color:var(--tape-ink); border:none; border-radius:var(--radius); font-family:var(--font-display); font-weight:700; font-style:italic; text-transform:uppercase; cursor:pointer; letter-spacing:.03em;}
  .login-error{color:var(--urgent); font-size:11.5px; margin-top:10px; min-height:14px;}

  /* ---------- top bar ---------- */
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--edge); padding:14px 18px 12px;}
  .role-row{display:flex; justify-content:space-between; align-items:center;}
  .topbar .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--brand-red); display:flex; align-items:center; gap:8px;}
  .topbar .eyebrow .dot{width:6px;height:6px;background:var(--brand-red);border-radius:1px;display:inline-block;}
  .role-pill{font-size:9.5px; border:1px solid var(--edge); padding:2px 8px; border-radius:20px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em;}
  .logout-btn{background:none;border:none;color:var(--ink-dim); font-size:11px; text-decoration:underline; cursor:pointer; padding:4px 0 0; margin-left:10px;}
  .topbar h1{font-family:var(--font-display); font-weight:700; font-style:italic; text-transform:uppercase; font-size:22px; letter-spacing:.01em; margin:4px 0 0; color:var(--ink); transform:skewX(-6deg); transform-origin:left; display:inline-block;}
  .brand-row{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:26px; width:auto; display:block;}
  .stripes{display:inline-flex; gap:3px; margin-left:8px; vertical-align:middle;}
  .stripes span{width:5px; height:16px; background:var(--tape); transform:skewX(-18deg); display:inline-block;}
  .stripes span:nth-child(2){background:var(--brand-red);}
  .stripes span:nth-child(3){background:var(--tape); opacity:.55;}
  .topbar .sub{font-size:11px;color:var(--ink-dim); margin-top:3px;}
  .back-row{display:flex; align-items:center; gap:10px; margin-bottom:2px;}
  .back-btn{background:none;border:1px solid var(--edge); color:var(--ink-dim); font-size:12px; padding:5px 10px;border-radius:var(--radius); cursor:pointer;}
  .back-btn:hover{border-color:var(--tape); color:var(--tape);}
  .back-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--tape); outline-offset:2px;}
  .sync-note{font-size:10px; color:var(--ink-dim); border:1px dashed var(--edge); padding:6px 10px; border-radius:var(--radius); margin:10px 18px 0;}

  /* ---------- home summary strip ---------- */
  .summary{display:flex; gap:8px; padding:16px 18px 4px;}
  .summary .chip{flex:1; border:1px solid var(--edge); border-radius:var(--radius); background:var(--surface); padding:10px 8px; text-align:center; cursor:pointer;}
  .summary .chip:hover{border-color:var(--tape);}
  .summary .chip .n{font-family:var(--font-display); font-size:22px; font-weight:700;}
  .summary .chip .l{font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); margin-top:2px;}
  .summary .chip.ok .n{color:var(--ok);}
  .summary .chip.warn .n{color:var(--warn);}
  .summary .chip.urgent .n{color:var(--urgent);}
  .summary .chip.dead .n{color:var(--dead-ink);}

  .home-actions{display:flex; gap:10px; padding:12px 18px 0;}
  .ghost-btn{flex:1; background:none; border:1px dashed var(--edge); color:var(--ink-dim); padding:10px; border-radius:var(--radius); font-size:12px; cursor:pointer;}
  .ghost-btn:hover{border-color:var(--tape); color:var(--tape);}

  /* ---------- aisle sign cards (home) ---------- */
  .aisles{padding:14px 18px 6px; display:flex; flex-direction:column; gap:14px;}
  .aisle-card{position:relative; background:var(--surface); border:1px solid var(--edge); border-radius:var(--radius); padding:16px 16px 14px 16px; transition:border-color .15s ease;}
  .aisle-card:hover{border-color:var(--tape);}
  .aisle-card .hang{position:absolute; top:-9px; left:16px; background:var(--brand-red); color:#fff; font-family:var(--font-display); font-weight:700; font-style:italic; font-size:11px; padding:2px 8px; border-radius:2px; letter-spacing:.04em;}
  .aisle-top{display:flex; justify-content:space-between; align-items:flex-start; margin-top:4px; cursor:pointer;}
  .aisle-name{font-family:var(--font-display); font-size:19px; font-weight:600; text-transform:uppercase;}
  .aisle-nfc{font-size:9.5px; color:var(--ink-dim); border:1px dashed var(--edge); padding:2px 6px; border-radius:3px; white-space:nowrap;}
  .aisle-status-row{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .pill{font-size:10.5px; padding:3px 8px; border-radius:20px; font-weight:500; display:inline-flex; align-items:center; gap:5px;}
  .pill.clickable{cursor:pointer;}
  .pill.clickable:hover{filter:brightness(1.2);}
  .pill::before{content:''; width:7px; height:7px; border-radius:50%; display:inline-block;}
  .pill.ok{background:rgba(63,183,121,.12); color:var(--ok);}
  .pill.ok::before{background:var(--ok);}
  .pill.warn{background:rgba(242,183,5,.12); color:var(--warn);}
  .pill.warn::before{background:var(--warn);}
  .pill.urgent{background:rgba(229,83,61,.14); color:var(--urgent);}
  .pill.urgent::before{background:var(--urgent);}
  .pill.dead{background:var(--dead); color:var(--dead-ink); border:1px solid var(--tape);}
  .pill.dead::before{background:var(--tape);}
  .aisle-bar{height:4px; border-radius:2px; overflow:hidden; display:flex; margin-top:12px; background:var(--edge);}
  .aisle-bar span{height:100%;}
  .aisle-del{margin-top:10px; background:none; border:none; color:var(--ink-dim); font-size:10px; text-decoration:underline; cursor:pointer; padding:0;}
  .aisle-del:hover{color:var(--urgent);}

  /* ---------- corridor detail ---------- */
  .corridor-head{padding:16px 18px 4px;}
  .corridor-head .name{font-family:var(--font-display); font-size:24px; font-weight:700; font-style:italic; text-transform:uppercase;}
  .corridor-head .meta{font-size:11px; color:var(--ink-dim); margin-top:2px;}

  .item-list{padding:14px 18px; display:flex; flex-direction:column; gap:10px;}
  .tag{position:relative; display:flex; background:var(--surface); border:1px solid var(--edge); border-radius:var(--radius); overflow:hidden;}
  .tag.editable{cursor:pointer;}
  .tag.editable:hover{border-color:var(--tape);}
  .tag .notch{width:14px; flex:none; background:var(--surface-2); clip-path: polygon(0 0, 100% 50%, 0 100%); position:relative;}
  .tag.status-ok .notch{background:var(--ok);}
  .tag.status-warn .notch{background:var(--warn);}
  .tag.status-urgent .notch{background:var(--urgent);}
  .tag.status-dead .notch{background:var(--dead); box-shadow:inset -2px 0 0 var(--tape);}
  .tag.status-dead{border-color:var(--tape);}
  .tag-body{flex:1; padding:12px 14px;}
  .tag-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .tag-names{display:flex; flex-direction:column; gap:3px;}
  .tag-cat{font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--tape); border:1px solid var(--edge); display:inline-block; padding:1px 6px; border-radius:3px; width:fit-content;}
  .tag-prod{font-family:var(--font-display); font-size:15.5px; font-weight:600; font-style:italic; text-transform:uppercase; letter-spacing:.01em;}
  .tag-days{font-family:var(--font-mono); font-size:12.5px; font-weight:600; white-space:nowrap;}
  .tag.status-ok .tag-days{color:var(--ok);}
  .tag.status-warn .tag-days{color:var(--warn);}
  .tag.status-urgent .tag-days{color:var(--urgent);}
  .tag.status-dead .tag-days{color:var(--dead-ink);}
  .tag-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; margin-top:8px; font-size:11.5px; color:var(--ink-dim);}
  .tag-grid b{color:var(--ink); font-weight:500;}
  .tag-flags{display:flex; gap:6px; margin-top:9px;}
  .flag{font-size:9.5px; padding:2px 7px; border-radius:3px; letter-spacing:.05em; text-transform:uppercase; font-weight:600;}
  .flag.desc{background:rgba(242,183,5,.15); color:var(--warn);}
  .flag.desc.high{background:rgba(229,83,61,.16); color:var(--urgent);}
  .flag.dead{background:var(--dead); color:var(--dead-ink); border:1px solid var(--tape); font-weight:700;}
  .flag.edit-hint{background:none; border:1px dashed var(--edge); color:var(--ink-dim); font-weight:500;}

  @keyframes pulseHi { 0%{box-shadow:0 0 0 0 rgba(242,183,5,.65);} 70%{box-shadow:0 0 0 12px rgba(242,183,5,0);} 100%{box-shadow:0 0 0 0 rgba(242,183,5,0);} }
  .tag.highlight{animation:pulseHi 1.3s ease-out 2; border-color:var(--tape);}

  .empty-note{padding:30px 18px; text-align:center; color:var(--ink-dim); font-size:12.5px;}

  /* ---------- mover (kanban) ---------- */
  .mover-intro{padding:0 18px 8px; font-size:11.5px; color:var(--ink-dim); line-height:1.5;}
  .mover-wrap{padding:6px 18px 20px; display:flex; gap:12px; overflow-x:auto;}
  .mover-col{flex:0 0 230px; background:var(--surface); border:1px solid var(--edge); border-radius:var(--radius); padding:10px; min-height:80px;}
  .mover-col.dragover{border-color:var(--tape); background:var(--surface-2);}
  .mover-col h3{font-family:var(--font-display); font-size:13px; text-transform:uppercase; margin:0 0 8px; color:var(--tape); letter-spacing:.03em;}
  .mover-card{background:var(--surface-2); border:1px solid var(--edge); border-radius:3px; padding:8px 9px; margin-bottom:8px; font-size:12px; cursor:grab;}
  .mover-card:active{cursor:grabbing;}
  .mover-card .mc-name{font-weight:600; font-size:12.5px;}
  .mover-card .mc-status{font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}
  .mover-card select{width:100%; margin-top:7px; background:var(--surface); border:1px solid var(--edge); color:var(--ink); font-size:11px; padding:5px; border-radius:3px;}

  /* ---------- FAB + modal ---------- */
  .fab{position:fixed; right:20px; bottom:22px; z-index:30; background:var(--tape); color:var(--tape-ink); border:none; border-radius:50px; padding:13px 18px; font-family:var(--font-display); font-weight:700; font-style:italic; font-size:13px; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.45); display:flex; align-items:center; gap:6px;}
  .fab:hover{filter:brightness(1.06);}
  .modal-overlay{position:fixed; inset:0; background:rgba(10,11,13,.72); display:none; align-items:flex-end; justify-content:center; z-index:40;}
  .modal-overlay.open{display:flex;}
  .modal{width:100%; max-width:560px; background:var(--surface); border-top:1px solid var(--edge); border-radius:14px 14px 0 0; padding:18px 18px 22px; max-height:90vh; overflow-y:auto;}
  .modal h2{font-family:var(--font-display); font-size:18px; text-transform:uppercase; margin:0 0 4px;}
  .modal .modal-sub{font-size:11px; color:var(--ink-dim); margin:0 0 14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:5px;}
  .field input, .field select{width:100%; background:var(--surface-2); border:1px solid var(--edge); color:var(--ink); padding:10px 11px; border-radius:var(--radius); font-size:13.5px;}
  .field input:focus, .field select:focus{border-color:var(--tape);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .scan-row{display:flex; gap:8px; align-items:flex-end;}
  .scan-row .field{flex:1; margin-bottom:0;}
  .scan-hint{font-size:10px; color:var(--ink-dim); margin-top:14px 0 0; padding-top:2px;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; padding:11px; border-radius:var(--radius); border:1px solid var(--edge); background:none; color:var(--ink-dim); font-size:13px; cursor:pointer;}
  .btn.primary{background:var(--tape); color:var(--tape-ink); border-color:var(--tape); font-weight:600;}
  .btn.danger{border-color:var(--urgent); color:var(--urgent);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>
<div id="app"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Adicionar item</h2>
    <p class="modal-sub" id="modalSub">Escaneie o UPC com o bipe (o cursor já está no campo) ou digite manualmente.</p>
    <form id="itemForm">
      <div class="scan-row">
        <div class="field">
          <label for="f-upc">UPC (bipe de caixa)</label>
          <input id="f-upc" type="text" placeholder="Aponte o bipe aqui e dispare" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <label for="f-corredor">Corredor</label>
        <select id="f-corredor"></select>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-categoria">Categoria</label>
          <input id="f-categoria" type="text" placeholder="Ex: Salgadinho">
        </div>
        <div class="field">
          <label for="f-produto">Produto</label>
          <input id="f-produto" type="text" placeholder="Ex: Ruffles">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-partnumber">Part Number</label>
          <input id="f-partnumber" type="text" placeholder="Ex: 101013">
        </div>
        <div class="field">
          <label for="f-sku">SKU</label>
          <input id="f-sku" type="text" placeholder="Ex: 100030163">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-pog">POG (localização)</label>
          <input id="f-pog" type="text" placeholder="Ex: 10">
        </div>
        <div class="field">
          <label for="f-lote">Lote</label>
          <input id="f-lote" type="text" placeholder="Ex: A004">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-validade">Validade</label>
          <input id="f-validade" type="date">
        </div>
        <div class="field">
          <label for="f-qtd">Quantidade</label>
          <input id="f-qtd" type="number" min="1" placeholder="Ex: 40">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="deleteBtn" style="display:none">Excluir item</button>
        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary">Salvar</button>
      </div>
      <div id="formError" style="color:var(--urgent); font-size:12px; margin-top:10px; display:none;"></div>
    </form>
  </div>
</div>

<script>
/* ================= dados (em memória — sem banco de dados nesta fase) ================= */
let corredores = [ { id: 1 }, { id: 2 }, { id: 3 } ];
let nextCorredorId = 4;

let itens = [
  { id: cid(), corredor: 1, categoria: 'Bala', produto: 'Bala Morango', upc: '7891000100019', partnumber: '100501', sku: '100030050', pog: '4', lote: 'A001', validade: '2026-10-28', quantidade: 60 },

  { id: cid(), corredor: 2, categoria: 'Salgadinho', produto: 'Ruffles', upc: '7892840011210', partnumber: '101013', sku: '100030163', pog: '10', lote: 'B001', validade: '2026-09-28', quantidade: 30 },
  { id: cid(), corredor: 2, categoria: 'Refrigerante', produto: 'Guaraná 2L', upc: '7894900011517', partnumber: '102240', sku: '100030241', pog: '6', lote: 'B002', validade: '2026-11-27', quantidade: 24 },
  { id: cid(), corredor: 2, categoria: 'Água', produto: 'Água Mineral 500ml', upc: '7896006711508', partnumber: '103011', sku: '100030311', pog: '7', lote: 'B003', validade: '2026-10-13', quantidade: 48 },
  { id: cid(), corredor: 2, categoria: 'Água desmineralizada', produto: 'Água Desmineralizada 5L', upc: '7898912340021', partnumber: '104502', sku: '100030452', pog: '11', lote: 'B004', validade: '2026-09-13', quantidade: 10 },
  { id: cid(), corredor: 2, categoria: 'Lavagem automotiva', produto: 'Cera Automotiva Premium', upc: '7899321004412', partnumber: '105870', sku: '100030587', pog: '12', lote: 'B005', validade: '2026-08-25', quantidade: 6 },

  { id: cid(), corredor: 3, categoria: 'Tinta', produto: 'Tinta Chemicolor', upc: '7897654321003', partnumber: '106004', sku: '100030604', pog: '3', lote: 'C004', validade: '2026-09-05', quantidade: 15 },
  { id: cid(), corredor: 3, categoria: 'Tinta', produto: 'Tinta Preta', upc: '7897654321010', partnumber: '106005', sku: '100030605', pog: '3', lote: 'C005', validade: '2026-08-24', quantidade: 4 },
];

function cid(){ return 'i' + Math.random().toString(36).slice(2,9); }

/* ================= persistência local (por aparelho) ================= */
// Isso guarda os dados neste navegador/aparelho, sobrevivendo a fechar a aba e recarregar.
// NÃO sincroniza entre aparelhos diferentes — isso só um banco de dados online resolve.
let persistDisponivel = true;
function salvarEstado(){
  if(!persistDisponivel) return;
  try{
    localStorage.setItem('cv_estado', JSON.stringify({ corredores, itens, nextCorredorId }));
  }catch(e){
    persistDisponivel = false; // ambiente bloqueou o armazenamento local — segue só em memória
  }
}
function carregarEstado(){
  try{
    const raw = localStorage.getItem('cv_estado');
    if(raw){
      const dados = JSON.parse(raw);
      if(dados && Array.isArray(dados.itens) && Array.isArray(dados.corredores)){
        corredores = dados.corredores;
        itens = dados.itens;
        nextCorredorId = dados.nextCorredorId || (Math.max(0, ...corredores.map(c=>c.id)) + 1);
      }
    }
  }catch(e){
    persistDisponivel = false;
  }
}

/* ================= autenticação (acesso simples por senha — não é segurança real) ================= */
const SENHA_COLABORADOR = '7606';
const SENHA_GERENTE = 's7606';
let role = null; // 'colaborador' | 'gerente'

/* ================= regras de validade ================= */
function diasRestantes(validadeStr){
  const hoje = new Date();
  hoje.setHours(0,0,0,0);
  const v = new Date(validadeStr + 'T00:00:00');
  return Math.round((v - hoje) / 86400000);
}
function statusDe(dias){
  if (dias <= 0) return 'dead';
  if (dias <= 7) return 'urgent';
  if (dias <= 30) return 'warn';
  return 'ok';
}
function descontoDe(status){
  if (status === 'dead') return { label: '⬤ RETIRAR DA PRATELEIRA', cls: 'dead' };
  if (status === 'urgent') return { label: '80% OFF', cls: 'desc high' };
  if (status === 'warn') return { label: '50% OFF', cls: 'desc' };
  return null;
}
function statusLabel(status){ return { ok:'OK', warn:'ATENÇÃO', urgent:'URGENTE', dead:'VENCIDO' }[status]; }
function statusWord(status){ return { ok:'ok', warn:'em atenção', urgent:'urgente', dead:'vencido' }[status]; }
function corredorLabel(c){ return c.nome ? ('Corredor ' + c.id + ' — ' + c.nome) : ('Corredor ' + c.id); }

/* ================= roteamento ================= */
function currentRoute(){
  const h = location.hash.replace('#','').split('/').filter(Boolean);
  if (h[0] === 'corredor' && h[1]) return { view:'corredor', id: parseInt(h[1],10), status: h[2] || null };
  if (h[0] === 'status' && h[1]) return { view:'status', status: h[1] };
  if (h[0] === 'mover') return { view:'mover' };
  return { view:'home' };
}
window.addEventListener('hashchange', render);

function goToStatus(status, corredorId){
  if(corredorId){ location.hash = '#/corredor/' + corredorId + '/' + status; return; }
  location.hash = '#/status/' + status;
}

/* ================= render principal ================= */
function render(){
  const app = document.getElementById('app');

  if(!role){
    app.innerHTML = renderLogin();
    wireLogin();
    return;
  }

  const route = currentRoute();
  if(route.view === 'mover' && role === 'gerente'){
    app.innerHTML = renderMover();
    wireMover();
    return;
  }
  if(route.view === 'status'){
    app.innerHTML = renderStatus(route.status);
    wireStatus(route.status);
    return;
  }
  if(route.view === 'corredor'){
    app.innerHTML = renderCorredor(route.id, route.status);
    wireCorredor(route.id, route.status);
    return;
  }
  app.innerHTML = renderHome();
  wireHome();
}

/* ================= login ================= */
function renderLogin(){
  return `
    <div class="login-wrap">
      <div class="login-card">
        <img src="autozone-logo.png" alt="AutoZone" class="brand-logo" style="height:44px; margin-bottom:10px;" onerror="this.style.display='none'">
        <div class="eyebrow">CONTROLE DE VALIDADE</div>
        <h1>Acesso à loja</h1>
        <p>Digite a senha do colaborador para consultar, ou a senha do gerente para editar.</p>
        <input id="pw" type="password" inputmode="numeric" placeholder="Senha" autofocus>
        <button id="pwBtn">Entrar</button>
        <div class="login-error" id="pwErr"></div>
      </div>
    </div>`;
}
function wireLogin(){
  const pw = document.getElementById('pw');
  const err = document.getElementById('pwErr');
  function tryLogin(){
    const v = pw.value.trim();
    if(v === SENHA_GERENTE){ role = 'gerente'; render(); }
    else if(v === SENHA_COLABORADOR){ role = 'colaborador'; render(); }
    else { err.textContent = 'Senha incorreta.'; }
  }
  document.getElementById('pwBtn').addEventListener('click', tryLogin);
  pw.addEventListener('keydown', e=>{ if(e.key === 'Enter') tryLogin(); });
}
function logout(){ role = null; location.hash = '#/'; render(); }

/* ================= home ================= */
function renderHome(){
  const hoje = new Date().toLocaleDateString('pt-BR');
  const counts = { ok:0, warn:0, urgent:0, dead:0 };
  itens.forEach(it => counts[statusDe(diasRestantes(it.validade))]++);

  const cards = corredores.map(c=>{
    const its = itens.filter(i=>i.corredor===c.id);
    const cc = { ok:0, warn:0, urgent:0, dead:0 };
    its.forEach(it=> cc[statusDe(diasRestantes(it.validade))]++);
    const total = its.length || 1;
    const pills = [];
    if(cc.dead)   pills.push('<span class="pill dead clickable" data-status="dead" data-corredor="'+c.id+'">'+cc.dead+' vencido'+(cc.dead>1?'s':'')+'</span>');
    if(cc.urgent) pills.push('<span class="pill urgent clickable" data-status="urgent" data-corredor="'+c.id+'">'+cc.urgent+' urgente'+(cc.urgent>1?'s':'')+'</span>');
    if(cc.warn)   pills.push('<span class="pill warn clickable" data-status="warn" data-corredor="'+c.id+'">'+cc.warn+' atenção</span>');
    if(cc.ok)     pills.push('<span class="pill ok">'+cc.ok+' ok</span>');
    const delBtn = role === 'gerente' ? '<button class="aisle-del" data-del="'+c.id+'">Excluir corredor</button>' : '';
    return `
      <div class="aisle-card">
        <span class="hang">CORREDOR ${String(c.id).padStart(2,'0')}</span>
        <div class="aisle-top" data-goto="${c.id}">
          <div class="aisle-name">${corredorLabel(c)}</div>
          <div class="aisle-nfc">NFC ${c.id}</div>
        </div>
        <div class="aisle-status-row">${pills.join('') || '<span class="pill ok">sem itens</span>'}</div>
        <div class="aisle-bar">
          <span style="width:${cc.dead/total*100}%; background:var(--dead-ink)"></span>
          <span style="width:${cc.urgent/total*100}%; background:var(--urgent)"></span>
          <span style="width:${cc.warn/total*100}%; background:var(--warn)"></span>
          <span style="width:${cc.ok/total*100}%; background:var(--ok)"></span>
        </div>
        ${delBtn}
      </div>`;
  }).join('');

  const actions = role === 'gerente' ? `
    <div class="home-actions">
      <button class="ghost-btn" id="addCorredorBtn">＋ Adicionar corredor</button>
      <button class="ghost-btn" id="moverBtn">⇅ Organizar itens</button>
    </div>` : '';

  return `
    <div class="topbar">
      <div class="role-row">
        <div class="brand-row"><img src="autozone-logo.png" alt="AutoZone" class="brand-logo" onerror="this.style.display='none'"><div class="eyebrow"><span class="dot"></span>RONDA DE VALIDADE</div></div>
        <div><span class="role-pill">${role === 'gerente' ? 'Gerente' : 'Colaborador'}</span><button class="logout-btn" id="logoutBtn">Sair</button></div>
      </div>
      <h1>Controle de Validade<span class="stripes"><span></span><span></span><span></span></span></h1>
      <div class="sub">${corredores.length} corredores cadastrados · atualizado ${hoje}</div>
    </div>
    <div class="sync-note">Os dados agora ficam salvos neste aparelho/navegador (sobrevivem a fechar a aba). Ainda não sincronizam entre celulares diferentes — isso exige um banco de dados online.</div>
    <div class="summary">
      <div class="chip ok" data-status="ok"><div class="n">${counts.ok}</div><div class="l">OK</div></div>
      <div class="chip warn" data-status="warn"><div class="n">${counts.warn}</div><div class="l">Atenção</div></div>
      <div class="chip urgent" data-status="urgent"><div class="n">${counts.urgent}</div><div class="l">Urgente</div></div>
      <div class="chip dead" data-status="dead"><div class="n">${counts.dead}</div><div class="l">Vencido</div></div>
    </div>
    ${actions}
    <div class="aisles">${cards}</div>
    ${role === 'gerente' ? '<button class="fab" id="fab">＋ Adicionar item</button>' : ''}
  `;
}

function wireHome(){
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=> location.hash = '#/corredor/' + el.dataset.goto);
  });
  document.querySelectorAll('.summary .chip').forEach(el=>{
    el.addEventListener('click', ()=> goToStatus(el.dataset.status));
  });
  document.querySelectorAll('.pill.clickable').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      goToStatus(el.dataset.status, parseInt(el.dataset.corredor,10));
    });
  });
  if(role === 'gerente'){
    document.getElementById('fab').addEventListener('click', ()=> openModal('add', null, null));
    document.getElementById('addCorredorBtn').addEventListener('click', ()=>{
      corredores.push({ id: nextCorredorId });
      nextCorredorId++;
      salvarEstado();
      render();
    });
    document.getElementById('moverBtn').addEventListener('click', ()=> location.hash = '#/mover');
    document.querySelectorAll('[data-del]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const id = parseInt(el.dataset.del,10);
        const temItens = itens.some(i=>i.corredor===id);
        if(temItens){ alert('Esse corredor ainda tem itens. Mova ou exclua os itens antes de remover o corredor.'); return; }
        if(!confirm('Excluir Corredor ' + id + '?')) return;
        corredores = corredores.filter(c=>c.id!==id);
        salvarEstado();
        render();
      });
    });
  }
}

/* ================= corredor ================= */
function renderCorredor(id, focusStatus){
  const c = corredores.find(x=>x.id===id);
  if(!c){ location.hash = '#/'; return ''; }
  const its = itens.filter(i=>i.corredor===id)
    .map(i => ({...i, dias: diasRestantes(i.validade), status: statusDe(diasRestantes(i.validade))}))
    .sort((a,b)=> a.dias - b.dias);

  const rows = its.map(i=>{
    const desc = descontoDe(i.status);
    const validadeBr = new Date(i.validade+'T00:00:00').toLocaleDateString('pt-BR');
    const diasTxt = i.dias <= 0 ? ('venceu há ' + Math.abs(i.dias) + 'd') : ('faltam ' + i.dias + 'd');
    const hi = focusStatus && i.status === focusStatus ? ' highlight' : '';
    const editableCls = role === 'gerente' ? ' editable' : '';
    return `
      <div class="tag status-${i.status}${hi}${editableCls}" id="item-${i.id}" data-id="${i.id}">
        <div class="notch"></div>
        <div class="tag-body">
          <div class="tag-top">
            <div class="tag-names">
              <span class="tag-cat">${escapeHtml(i.categoria)}</span>
              <div class="tag-prod">${escapeHtml(i.produto)}</div>
            </div>
            <div class="tag-days">${diasTxt}</div>
          </div>
          <div class="tag-grid">
            <div>UPC <b>${escapeHtml(i.upc || '—')}</b></div>
            <div>POG (localização) <b>${escapeHtml(i.pog || '—')}</b></div>
            <div>Part Number <b>${escapeHtml(i.partnumber || '—')}</b></div>
            <div>SKU <b>${escapeHtml(i.sku || '—')}</b></div>
            <div>Lote <b>${escapeHtml(i.lote)}</b></div>
            <div>Validade <b>${validadeBr}</b></div>
            <div>Qtd <b>${i.quantidade}</b></div>
          </div>
          <div class="tag-flags">
            <span class="flag ${desc ? desc.cls : ''}" style="${desc?'':'display:none'}">${desc?desc.label:''}</span>
            <span class="flag" style="background:rgba(255,255,255,.06); color:var(--ink-dim);">${statusLabel(i.status)}</span>
            ${role === 'gerente' ? '<span class="flag edit-hint">toque para editar</span>' : ''}
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="topbar">
      <div class="back-row"><button class="back-btn" id="backBtn">← Todos os corredores</button><span class="role-pill">${role === 'gerente' ? 'Gerente' : 'Colaborador'}</span></div>
      <div class="eyebrow"><span class="dot"></span>CORREDOR ${String(c.id).padStart(2,'0')} · NFC ${c.id}</div>
      <div class="corridor-head" style="padding:0">
        <div class="name">${corredorLabel(c)}</div>
        <div class="meta">${its.length} ite${its.length===1?'m':'ns'} cadastrado${its.length===1?'':'s'} · ordenado por vencimento ${role === 'gerente' ? '· <a href="#" id="renameBtn" style="color:var(--tape); text-decoration:underline;">renomear</a>' : ''}</div>
      </div>
    </div>
    <div class="item-list">
      ${its.length ? rows : '<div class="empty-note">Nenhum item cadastrado neste corredor ainda.</div>'}
    </div>
    ${role === 'gerente' ? '<button class="fab" id="fab">＋ Adicionar item</button>' : ''}
  `;
}

function wireCorredor(id, focusStatus){
  document.getElementById('backBtn').addEventListener('click', ()=> location.hash = '#/');
  if(role === 'gerente'){
    document.getElementById('fab').addEventListener('click', ()=> openModal('add', null, id));
    document.querySelectorAll('.tag.editable').forEach(el=>{
      el.addEventListener('click', ()=> openModal('edit', el.dataset.id, null));
    });
    const renameBtn = document.getElementById('renameBtn');
    if(renameBtn){
      renameBtn.addEventListener('click', (e)=>{
        e.preventDefault();
        const c = corredores.find(x=>x.id===id);
        const novoNome = prompt('Nome do corredor (deixe em branco para remover o nome):', c.nome || '');
        if(novoNome === null) return;
        c.nome = novoNome.trim();
        salvarEstado();
        render();
      });
    }
  }
  if(focusStatus){
    const target = document.querySelector('.tag.highlight');
    if(target) setTimeout(()=> target.scrollIntoView({behavior:'smooth', block:'center'}), 80);
  }
}

/* ================= visão agregada por status (todos os corredores) ================= */
function renderStatus(status){
  const its = itens
    .map(i => ({...i, dias: diasRestantes(i.validade), status: statusDe(diasRestantes(i.validade))}))
    .filter(i => i.status === status)
    .sort((a,b)=> a.dias - b.dias);

  const rows = its.map(i=>{
    const desc = descontoDe(i.status);
    const validadeBr = new Date(i.validade+'T00:00:00').toLocaleDateString('pt-BR');
    const diasTxt = i.dias <= 0 ? ('venceu há ' + Math.abs(i.dias) + 'd') : ('faltam ' + i.dias + 'd');
    const editableCls = role === 'gerente' ? ' editable' : '';
    const cLabel = corredorLabel(corredores.find(c=>c.id===i.corredor) || {id:i.corredor});
    return `
      <div class="tag status-${i.status}${editableCls}" data-id="${i.id}" data-corredor="${i.corredor}">
        <div class="notch"></div>
        <div class="tag-body">
          <div class="tag-top">
            <div class="tag-names">
              <span class="tag-cat">${escapeHtml(cLabel)} · ${escapeHtml(i.categoria)}</span>
              <div class="tag-prod">${escapeHtml(i.produto)}</div>
            </div>
            <div class="tag-days">${diasTxt}</div>
          </div>
          <div class="tag-grid">
            <div>POG (localização) <b>${escapeHtml(i.pog || '—')}</b></div>
            <div>Lote <b>${escapeHtml(i.lote)}</b></div>
            <div>Validade <b>${validadeBr}</b></div>
            <div>Qtd <b>${i.quantidade}</b></div>
          </div>
          <div class="tag-flags">
            <span class="flag ${desc ? desc.cls : ''}" style="${desc?'':'display:none'}">${desc?desc.label:''}</span>
            ${role === 'gerente' ? '<span class="flag edit-hint">toque para editar</span>' : '<span class="flag edit-hint">toque para ver no corredor</span>'}
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="topbar">
      <div class="back-row"><button class="back-btn" id="backBtn">← Todos os corredores</button><span class="role-pill">${role === 'gerente' ? 'Gerente' : 'Colaborador'}</span></div>
      <div class="eyebrow"><span class="dot"></span>TODOS OS CORREDORES</div>
      <div class="corridor-head" style="padding:0">
        <div class="name">${statusLabel(status)}</div>
        <div class="meta">${its.length} ite${its.length===1?'m':'ns'} · de todos os corredores, agrupados</div>
      </div>
    </div>
    <div class="item-list">
      ${its.length ? rows : '<div class="empty-note">Nenhum item nesse status agora.</div>'}
    </div>
  `;
}

function wireStatus(status){
  document.getElementById('backBtn').addEventListener('click', ()=> location.hash = '#/');
  document.querySelectorAll('.tag[data-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(role === 'gerente'){
        openModal('edit', el.dataset.id, null);
      } else {
        location.hash = '#/corredor/' + el.dataset.corredor + '/' + status;
      }
    });
  });
}


function renderMover(){
  const cols = corredores.map(c=>{
    const its = itens.filter(i=>i.corredor===c.id).map(i=>({...i, status: statusDe(diasRestantes(i.validade))}));
    const cards = its.map(i=>{
      const opts = corredores.map(cc=>'<option value="'+cc.id+'"'+(cc.id===c.id?' selected':'')+'>'+corredorLabel(cc)+'</option>').join('');
      return `
        <div class="mover-card" draggable="true" data-id="${i.id}">
          <div class="mc-name">${escapeHtml(i.produto)}</div>
          <div class="mc-status">${statusWord(i.status)}</div>
          <select data-move="${i.id}">${opts}</select>
        </div>`;
    }).join('');
    return `<div class="mover-col" data-corredor="${c.id}"><h3>${corredorLabel(c)}</h3>${cards}</div>`;
  }).join('');

  return `
    <div class="topbar">
      <div class="back-row"><button class="back-btn" id="backBtn">← Voltar</button><span class="role-pill">Gerente</span></div>
      <h1>Organizar itens</h1>
    </div>
    <div class="mover-intro">Arraste um item para outro corredor (funciona bem no computador) — ou use o menu abaixo do item, que funciona em qualquer celular.</div>
    <div class="mover-wrap">${cols}</div>
  `;
}

function wireMover(){
  document.getElementById('backBtn').addEventListener('click', ()=> location.hash = '#/');

  // seletor manual (funciona em qualquer aparelho, inclusive celular)
  document.querySelectorAll('[data-move]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const it = itens.find(i=>i.id === sel.dataset.move);
      if(it) it.corredor = parseInt(sel.value,10);
      salvarEstado();
      render();
    });
  });

  // arrastar e soltar (funciona bem em desktop)
  let draggedId = null;
  document.querySelectorAll('.mover-card').forEach(card=>{
    card.addEventListener('dragstart', ()=>{ draggedId = card.dataset.id; });
  });
  document.querySelectorAll('.mover-col').forEach(col=>{
    col.addEventListener('dragover', (e)=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', (e)=>{
      e.preventDefault();
      col.classList.remove('dragover');
      if(!draggedId) return;
      const it = itens.find(i=>i.id === draggedId);
      if(it) it.corredor = parseInt(col.dataset.corredor,10);
      draggedId = null;
      salvarEstado();
      render();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; });
}

/* ================= modal: adicionar / editar item ================= */
const overlay = document.getElementById('modalOverlay');
const form = document.getElementById('itemForm');
const selCorredor = document.getElementById('f-corredor');
const deleteBtn = document.getElementById('deleteBtn');
let editingId = null;

function openModal(mode, itemId, presetCorredorId){
  selCorredor.innerHTML = corredores.map(c=>'<option value="'+c.id+'">'+corredorLabel(c)+'</option>').join('');
  form.reset();
  editingId = null;
  document.getElementById('formError').style.display = 'none';

  if(mode === 'edit'){
    const it = itens.find(i=>i.id===itemId);
    if(!it) return;
    editingId = it.id;
    document.getElementById('modalTitle').textContent = 'Editar item';
    document.getElementById('modalSub').textContent = 'Altere quantidade, lote, validade ou mova de corredor.';
    document.getElementById('f-upc').value = it.upc || '';
    selCorredor.value = it.corredor;
    document.getElementById('f-categoria').value = it.categoria || '';
    document.getElementById('f-produto').value = it.produto || '';
    document.getElementById('f-partnumber').value = it.partnumber || '';
    document.getElementById('f-sku').value = it.sku || '';
    document.getElementById('f-pog').value = it.pog || '';
    document.getElementById('f-lote').value = it.lote || '';
    document.getElementById('f-validade').value = it.validade || '';
    document.getElementById('f-qtd').value = it.quantidade || '';
    deleteBtn.style.display = 'block';
  } else {
    document.getElementById('modalTitle').textContent = 'Adicionar item';
    document.getElementById('modalSub').textContent = 'Escaneie o UPC com o bipe (o cursor já está no campo) ou digite manualmente.';
    if(presetCorredorId) selCorredor.value = presetCorredorId;
    deleteBtn.style.display = 'none';
  }

  overlay.classList.add('open');
  setTimeout(()=> document.getElementById('f-upc').focus(), 50);
}
function closeModal(){ overlay.classList.remove('open'); editingId = null; }
document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });

// bipe de código de barras: ele "digita" rápido e finaliza com Enter — usamos isso para pular pro próximo campo
document.getElementById('f-upc').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ e.preventDefault(); document.getElementById('f-categoria').focus(); }
});

deleteBtn.addEventListener('click', ()=>{
  if(!editingId) return;
  if(!confirm('Excluir este item?')) return;
  itens = itens.filter(i=>i.id !== editingId);
  closeModal();
  salvarEstado();
  render();
});

form.addEventListener('submit', (e)=>{
  e.preventDefault();
  const errEl = document.getElementById('formError');
  errEl.style.display = 'none';

  const categoria = document.getElementById('f-categoria').value.trim();
  const produto = document.getElementById('f-produto').value.trim();
  const lote = document.getElementById('f-lote').value.trim();
  const validade = document.getElementById('f-validade').value;
  const qtdRaw = document.getElementById('f-qtd').value;
  const quantidade = parseInt(qtdRaw, 10);

  const faltando = [];
  if(!categoria) faltando.push('Categoria');
  if(!produto) faltando.push('Produto');
  if(!lote) faltando.push('Lote');
  if(!validade) faltando.push('Validade');
  if(!qtdRaw || isNaN(quantidade) || quantidade < 1) faltando.push('Quantidade');

  if(faltando.length){
    errEl.textContent = 'Preencha: ' + faltando.join(', ') + '.';
    errEl.style.display = 'block';
    return;
  }

  const data = {
    corredor: parseInt(selCorredor.value,10),
    upc: document.getElementById('f-upc').value.trim(),
    categoria: categoria,
    produto: produto,
    partnumber: document.getElementById('f-partnumber').value.trim(),
    sku: document.getElementById('f-sku').value.trim(),
    pog: document.getElementById('f-pog').value.trim(),
    lote: lote,
    validade: validade,
    quantidade: quantidade,
  };
  if(editingId){
    const it = itens.find(i=>i.id === editingId);
    Object.assign(it, data);
  } else {
    itens.push(Object.assign({ id: cid() }, data));
  }
  closeModal();
  salvarEstado();
  render();
});

carregarEstado();
render();
</script>
